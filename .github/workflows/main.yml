name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract, Bump Version, and Build
      run: |
        if [ -f "source.zip" ]; then
          unzip source.zip -d build_temp
          cd build_temp
        fi
        
        PROJECT_DIR=$(find . -name "settings.gradle*" -type f | head -n 1 | xargs dirname)
        
        if [ -z "$PROJECT_DIR" ]; then
          echo "Error: Could not find project root!"
          exit 1
        fi
        
        cd "$PROJECT_DIR"
        echo "Project found in: $PROJECT_DIR"
        
        # --- بخش جادویی: پیدا کردن و افزایش versionCode و versionName ---
        # ۱. پیدا کردن فایل build.gradle یا build.gradle.kts در پوشه app
        BUILD_FILE=""
        if [ -f "app/build.gradle.kts" ]; then BUILD_FILE="app/build.gradle.kts"; 
        elif [ -f "app/build.gradle" ]; then BUILD_FILE="app/build.gradle"; 
        fi

        if [ -n "$BUILD_FILE" ]; then
          echo "Found build file: $BUILD_FILE"
          # استخراج عدد فعلی ورژن کد
          CURRENT_CODE=$(grep -oP 'versionCode\s*[=\s]\s*\K\d+' "$BUILD_FILE" | head -n 1)
          if [ -n "$CURRENT_CODE" ]; then
            NEW_CODE=$((CURRENT_CODE + 1))
            echo "Bumping versionCode from $CURRENT_CODE to $NEW_CODE"
            # جایگزینی عدد جدید در فایل
            sed -i "s/versionCode\s*[=\s]\s*$CURRENT_CODE/versionCode = $NEW_CODE/g" "$BUILD_FILE"
            sed -i "s/versionCode\s*[=\s]\s*$CURRENT_CODE/versionCode $NEW_CODE/g" "$BUILD_FILE"
          fi

          # استخراج و افزایش نسخه نمایشی (مثلاً از 1.0 به 1.1)
          CURRENT_NAME=$(grep -oP 'versionName\s*[=\s]\s*"\K[^"]+' "$BUILD_FILE" | head -n 1)
          if [ -n "$CURRENT_NAME" ]; then
             # این خط فقط یه عدد ۰.۱ به انتهای ورژن اضافه میکنه
             NEW_NAME="${CURRENT_NAME}.1"
             echo "Bumping versionName from $CURRENT_NAME to $NEW_NAME"
             sed -i "s/versionName\s*[=\s]\s*\"$CURRENT_NAME\"/versionName = \"$NEW_NAME\"/g" "$BUILD_FILE"
             sed -i "s/versionName\s*[=\s]\s*\"$CURRENT_NAME\"/versionName \"$NEW_NAME\"/g" "$BUILD_FILE"
          fi
        else
          echo "Warning: build.gradle file not found. Skipping version bump."
        fi
        # -------------------------------------------------------------

        if [ ! -f "gradlew" ]; then
          echo "gradlew not found. Installing gradle..."
          gradle wrapper
        fi
        
        chmod +x gradlew
        
        sed -i 's/signingConfig signingConfigs.release//g' app/build.gradle || true
        sed -i 's/signingConfig = signingConfigs.getByName("release")//g' app/build.gradle.kts || true
        
        ./gradlew assembleRelease

    - name: Find and Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: "**/*.apk"
