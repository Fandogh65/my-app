name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract and Build
      run: |
        # باز کردن زیپ
        if [ -f "source.zip" ]; then
          unzip source.zip -d build_temp
          cd build_temp
        else
          echo "source.zip not found, checking root..."
        fi

        # پیدا کردن فایل gradlew
        GRADLEW_FILE=$(find . -name "gradlew" -type f | head -n 1)
        
        if [ -z "$GRADLEW_FILE" ]; then
          echo "Error: Could not find gradlew anywhere!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$GRADLEW_FILE")
        echo "Found project in: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # دادن دسترسی و بیلد
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Find and Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        # این خط میره کل پروژه رو میگرده، هر فایل APK پیدا کرد برمیداره!
        path: "**/*.apk"
