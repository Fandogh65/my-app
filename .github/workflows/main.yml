name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract and Build
      run: |
        if [ -f "source.zip" ]; then
          unzip source.zip -d build_temp
          cd build_temp
        fi
        
        # پیدا کردن پوشه اصلی پروژه (جایی که فایل settings.gradle.kts هست)
        PROJECT_DIR=$(find . -name "settings.gradle*" -type f | head -n 1 | xargs dirname)
        
        if [ -z "$PROJECT_DIR" ]; then
          echo "Error: Could not find project root!"
          exit 1
        fi
        
        cd "$PROJECT_DIR"
        echo "Project found in: $PROJECT_DIR"
        
        # اگر فایل gradlew نبود، خودش با gradle نصبش میکنه
        if [ ! -f "gradlew" ]; then
          echo "gradlew not found. Installing gradle..."
          gradle wrapper
        fi
        
        # اجرای بیلد
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Find and Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: "**/*.apk"
